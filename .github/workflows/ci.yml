name: CI

# Runs the dependency-free unit/contract suite on every pull request and on
# pushes to main. No secrets are used and nothing contacts the NUC or Supabase.
# Browser (*.py) and database (*.sh) suites need a live stack and stay manual.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # grading-policy.test.cjs compares against a baseline commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # node:module stripTypeScriptTypes requires Node 22.13+
      - name: Syntax check frontend scripts
        run: for f in *.js; do node --check "$f" || exit 1; done
      - name: Unit and contract tests
        run: node --test tests/*.test.cjs

  browser:
    # Isolated Chromium suites: assets are served from this checkout and every
    # request to another host is blocked. No secrets, no NUC, no Supabase.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (uses the runner's Google Chrome)
        run: pip install playwright==1.*
      - name: Browser suites
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: |
          set -e
          for suite in browser-workflow browser-accessibility browser-responsive \
                       browser-phase-navigation browser-unresolved-navigation \
                       browser-auth-layout browser-auth-flows browser-admin-accounts \
                       browser-test-majcom browser-remove-student browser-offline-startup \
                       browser-offline-evaluation browser-device-storage \
                       browser-student-assignment; do
            echo "::group::$suite"
            python "tests/$suite.py"
            echo "::endgroup::"
          done

  database:
    # Network-isolated PostgreSQL 17 test of the offline finalization migration
    # against a synthetic schema. Never contacts the NUC.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull PostgreSQL image
        run: docker pull postgres:17.6
      - name: Offline finalization migration suite
        run: |
          out=$(bash tests/offline-finalization.sh)
          echo "$out"
          echo "$out" | grep -q 'ALL OFFLINE FINALIZATION ASSERTIONS PASSED'
