name: Android app

# Packages the RaPS web app as an Android app with Capacitor.
# - Pull requests: build and attach an APK to the run (for testing).
# - Pushes to main with signing secrets: build a signed release APK and publish
#   it as a GitHub Release (stable download page for instructors).
# Signed builds need ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. Without them the APK is a test
# build: Android will not install a later build over it without uninstalling,
# which deletes unsynced records. See docs/ANDROID-APP.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Read RaPS version
        id: v
        run: |
          NAME=$(node -e "const s=require('fs').readFileSync('version.js','utf8');console.log(s.match(/versionName: '([^']+)'/)[1])")
          CODE=$(node -e "const s=require('fs').readFileSync('version.js','utf8');const c=+s.match(/versionCode: (\d+)/)[1];const n=s.match(/web\.(\d+)/);console.log(c*100+(n?+n[1]:0))")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "RaPS $NAME (Android versionCode $CODE)"

      - name: Install Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Bundle the web app
        run: bash android-app/prepare-web.sh

      - name: Create the Android project
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.v.outputs.code }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.v.outputs.name }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: App icon
        working-directory: android-app
        continue-on-error: true
        run: |
          mkdir -p assets
          cp ../assets/icon-512.png assets/icon-only.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#08131d' --iconBackgroundColorDark '#08131d'

      - name: Build APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          OUT="$GITHUB_WORKSPACE/RaPS-${{ steps.v.outputs.name }}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/raps.keystore"
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/raps.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "$OUT.apk"
            rm -f "$RUNNER_TEMP/raps.keystore"
            echo "APK_PATH=$OUT.apk" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT-TEST-BUILD.apk"
            echo "APK_PATH=$OUT-TEST-BUILD.apk" >> "$GITHUB_ENV"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No signing key configured: this is a TEST BUILD. Installing a later build requires uninstalling, which deletes unsynced records."
          fi
          ls -la "$GITHUB_WORKSPACE"/RaPS-*.apk

      - name: Check the bundle inside the APK
        run: |
          unzip -l "$APK_PATH" | grep -E "assets/public/(index.html|app.js|vendor/supabase-js)" || { echo "Web app missing from APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: RaPS-${{ steps.v.outputs.name }}-android
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Publish signed release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ steps.v.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not replacing it."
          else
            gh release create "$TAG" "$APK_PATH" --title "RaPS ${{ steps.v.outputs.name }} for Android" \
              --notes "Signed Android build of RaPS ${{ steps.v.outputs.name }}. Install over the previous version; Sync Classes first. See docs/ANDROID-APP.md."
          fi
